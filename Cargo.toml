[package]
name = "sky-circuit-breaker"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
